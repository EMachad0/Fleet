services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Convex backend API — exposed to host because the browser (via E2E tests)
      # needs to reach the Convex API directly
      - '${CONVEX_BACKEND_PORT:?missing CONVEX_BACKEND_PORT}:3210'
      # Convex site proxy (HTTP actions) — exposed to host because the browser
      # needs to reach auth callback routes
      - '${SITE_PROXY_PORT:?missing SITE_PROXY_PORT}:3211'
    volumes:
      - ./out/data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://localhost:${CONVEX_BACKEND_PORT:?missing CONVEX_BACKEND_PORT}
      - CONVEX_SITE_ORIGIN=http://localhost:${SITE_PROXY_PORT:?missing SITE_PROXY_PORT}
      - INSTANCE_NAME=${INSTANCE_NAME:?missing INSTANCE_NAME}
      - INSTANCE_SECRET=${INSTANCE_SECRET:?missing INSTANCE_SECRET}
      - DISABLE_BEACON=true
      - DISABLE_METRICS_ENDPOINT=true
      - DOCUMENT_RETENTION_DELAY=172800
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Convex dashboard UI — exposed to host for debugging and data inspection
      - '${DASHBOARD_PORT:?missing DASHBOARD_PORT}:6791'
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://localhost:${CONVEX_BACKEND_PORT:?missing CONVEX_BACKEND_PORT}
    depends_on:
      backend:
        condition: service_healthy

  convex-dev:
    build:
      context: .
      target: convex-dev
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:?missing CONVEX_SELF_HOSTED_ADMIN_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?missing BETTER_AUTH_SECRET}
      - VITE_PORT=${VITE_PORT:?missing VITE_PORT}
    volumes:
      - ./src/convex:/fleet/src/convex
      - ./convex.json:/fleet/convex.json
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # SvelteKit dev server — exposed to host as the main app entry point
      # for the agent and E2E tests
      - '${VITE_PORT:?missing VITE_PORT}:5173'
    environment:
      - PUBLIC_CONVEX_URL=http://localhost:${CONVEX_BACKEND_PORT:?missing CONVEX_BACKEND_PORT}
      - PUBLIC_CONVEX_SITE_URL=http://localhost:${SITE_PROXY_PORT:?missing SITE_PROXY_PORT}
      - PUBLIC_SITE_URL=http://localhost:${VITE_PORT:?missing VITE_PORT}
    volumes:
      - ./src:/fleet/src
      - ./svelte.config.js:/fleet/svelte.config.js
      - ./vite.config.ts:/fleet/vite.config.ts
      - ./tsconfig.json:/fleet/tsconfig.json
      - ./components.json:/fleet/components.json
      - ./static:/fleet/static
    depends_on:
      backend:
        condition: service_healthy
